#homeBtn[hidden]{display:none}
h1,h2,.big{font-family:Lalezar,Tajawal,sans-serif;font-weight:400;margin:0}
.card{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:22px 16px;box-shadow:6px 6px 0 var(--ink)}
.rule{font-size:19px;line-height:1.7;margin:10px 0 18px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:8px 0 20px}
.tile{min-width:74px;min-height:88px;border:3px solid var(--ink);border-radius:16px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 10px}
.em{font-size:50px;line-height:1}
.nm{display:none;font-size:15px;margin-top:4px;color:var(--violet)}
.nm.show{display:block}
.fl{font-size:12px;color:var(--mute)}
.ltr{font-family:Lalezar,sans-serif;font-size:44px}
.op{font-family:Lalezar,sans-serif;font-size:36px;color:var(--violet)}
.q{background:var(--sun);color:#1B1747}
.riddle{font-size:25px;line-height:1.8;text-align:center;margin:12px 0 20px}
input{width:100%;font:inherit;font-size:24px;text-align:center;padding:11px;border:3px solid var(--ink);border-radius:14px;background:var(--bg);color:var(--ink);margin-bottom:10px}
input:focus-visible,button:focus-visible{outline:4px solid var(--violet);outline-offset:2px}
.btns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
button{font:inherit;font-weight:700;font-size:18px;padding:12px 16px;border:3px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);cursor:pointer;flex:1}
button.main{background:var(--violet);color:#fff}
button.sel{background:var(--sun);color:#1B1747}
button,.tile,.chip{transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .18s,background .18s}
@media (hover:hover){
button:hover{transform:translateY(-4px) rotate(-2deg) scale(1.05);box-shadow:5px 7px 0 var(--ink)}
.opts button:nth-child(even):hover{transform:translateY(-4px) rotate(2deg) scale(1.05)}
button:hover,.tile:hover,.chip:hover{background:var(--sun);color:#1B1747}
#homeBtn:hover{transform:rotate(360deg) scale(1.12);transition-duration:.5s}
.tile:hover{transform:translateY(-5px) rotate(3deg) scale(1.08)}
.tile:hover .em{animation:wig .6s ease-in-out}
.chip:hover{transform:scale(1.08) rotate(-2deg)}
}
button:active{transform:translateY(2px) scale(.96);box-shadow:none}
@keyframes wig{20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
@media (prefers-reduced-motion:reduce){button,.tile,.chip{transition:none}button:hover,.tile:hover,.chip:hover,#homeBtn:hover{transform:none}.tile:hover .em{animation:none}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{font-size:21px;padding:16px 8px}
.gl{display:grid;gap:12px}
.gl button{font-size:24px;padding:18px}
.gl small{display:block;font-size:14px;font-weight:500;opacity:.85;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chips button{flex:none;font-size:16px;padding:8px 12px}
.msg{min-height:26px;text-align:center;margin-top:8px;font-size:18px}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.win{font-size:50px;text-align:center;font-family:Lalezar,sans-serif}
.center{text-align:center}
.score{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.chip{flex:none;padding:6px 12px;border:3px solid var(--ink);border-radius:20px;background:var(--card);font-size:15px}
.chip.on{background:var(--sun);color:#1B1747}
.rk{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:2px dashed var(--mute);font-size:21px}
.tm{font-family:Lalezar,sans-serif;font-size:80px;color:var(--violet)}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.hero{border-radius:16px;overflow:hidden;margin-bottom:14px;background:rgb(22,7,61)}
.hero img{display:block;width:100%;height:auto}
.sr{position:absolute;left:-9999px}
.bomb{font-size:90px;line-height:1.2;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.15) rotate(6deg)}}
@media (prefers-reduced-motion:reduce){.bomb{animation:none}}
.brand{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:12px;display:flex;align-items:center;gap:8px;z-index:5;direction:ltr;pointer-events:none}
.brand img{width:46px;height:46px;border-radius:12px;display:block}
.brand b{font-family:Lalezar,Tajawal,sans-serif;font-weight:400;font-size:30px;line-height:1;color:var(--ink)}
.cd{font-family:Lalezar,sans-serif;font-size:60px;line-height:1;color:var(--bad)}
/* ---------- خلفية الشاشة الرئيسية فقط ---------- */
#homeBg{display:block;position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:linear-gradient(180deg,#1A0B3D 0%,#120830 55%,#0D0524 100%)}
#homeBg~.brand b{color:#F1EEFF}
#homeBg i,#homeBg b{position:absolute;display:block;border-radius:50%;pointer-events:none;will-change:transform}
#homeBg i{width:90vmin;height:90vmin}
#homeBg .o1{top:-25%;inset-inline-start:-30%;background:radial-gradient(circle,rgba(124,77,255,.55) 0,rgba(124,77,255,0) 65%);animation:bgA 16s ease-in-out infinite alternate}
#homeBg .o2{bottom:-30%;inset-inline-end:-35%;width:110vmin;height:110vmin;background:radial-gradient(circle,rgba(150,90,255,.42) 0,rgba(150,90,255,0) 65%);animation:bgB 19s ease-in-out infinite alternate}
#homeBg .o3{top:30%;inset-inline-end:-20%;width:70vmin;height:70vmin;background:radial-gradient(circle,rgba(98,54,230,.45) 0,rgba(98,54,230,0) 65%);animation:bgC 17s ease-in-out infinite alternate}
#homeBg .o4{bottom:5%;inset-inline-start:-15%;width:55vmin;height:55vmin;background:radial-gradient(circle,rgba(255,140,50,.16) 0,rgba(255,140,50,0) 65%);animation:bgD 22s ease-in-out infinite alternate}
#homeBg b{width:6px;height:6px;background:rgba(214,196,255,.55);opacity:.5;animation:bgP 11s ease-in-out infinite alternate}
#homeBg b:nth-of-type(1){top:12%;inset-inline-start:15%;animation-duration:11s}
#homeBg b:nth-of-type(2){top:28%;inset-inline-start:78%;width:4px;height:4px;animation-duration:14s;animation-delay:-2s}
#homeBg b:nth-of-type(3){top:46%;inset-inline-start:8%;width:5px;height:5px;animation-duration:13s;animation-delay:-1s}
#homeBg b:nth-of-type(4){top:62%;inset-inline-start:88%;animation-duration:15s;animation-delay:-3s}
#homeBg b:nth-of-type(5){top:78%;inset-inline-start:30%;width:4px;height:4px;background:rgba(255,170,100,.5);animation-duration:13s;animation-delay:-1s}
#homeBg b:nth-of-type(6){top:88%;inset-inline-start:66%;width:5px;height:5px;animation-duration:16s;animation-delay:-4s}
#homeBg b:nth-of-type(7){top:6%;inset-inline-start:52%;width:4px;height:4px;animation-duration:14s;animation-delay:-2s}
@keyframes bgA{to{transform:translate3d(18%,14%,0) scale(1.12)}}
@keyframes bgB{to{transform:translate3d(-16%,-12%,0) scale(1.08)}}
@keyframes bgC{to{transform:translate3d(-14%,10%,0) scale(1.15)}}
@keyframes bgD{to{transform:translate3d(20%,-14%,0) scale(1.1)}}
@keyframes bgP{0%{transform:translate3d(0,0,0)}50%{transform:translate3d(14px,-22px,0);opacity:.75}100%{transform:translate3d(-12px,-44px,0)}}
@media (prefers-reduced-motion:reduce){#homeBg i,#homeBg b{animation:none}}
</style>
</head>

function tile(t,f){
  if(t.includes(":")){const[e,n]=t.split(":");return `<div class="tile"><span class="em">${e}</span><span class="nm">${n}</span>${f?'<span class="fl">أول حرف</span>':''}</div>`}
  if(t==="+"||t==="−")return `<div class="op">${t}</div>`;
  return `<div class="tile"><span class="ltr">${t}</span></div>`;
}
function home(){
  screen(`<div class="card center"><h1 class="sr">خَبْصَة</h1><p class="rule">اختر لعبتك</p><div class="gl">
  <button class="main" data-m="pic">🧩 فكّ الصورة<small>جمع وحذف وتبديل ودخيل</small></button>
  <button class="main" data-m="rid">💡 ألغاز<small>اكتب الجواب أو اختر</small></button>
  <button class="main" data-m="out">🕵️ برا السالفة<small>الكل يعرف الكلمة إلا واحد. اكشفه!</small></button>
  <button class="main" data-m="bomb">💣 القنبلة<small>مرّر الجوال وجاوب قبل لا تنفجر</small></button></div></div>`);
  $("homeBtn").hidden=true;document.body.classList.add("is-home");
  qa("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;if(mode==="out"){names=["","",""];setup(true)}else if(mode==="bomb"){names=["",""];setup(true)}else who()});
}
function who(){
  screen(`<div class="card center"><h2 style="font-size:38px">كم لاعب؟</h2><div class="btns"><button class="main" id="s">لعب فردي</button><button class="main" id="g">لعب جماعي</button></div><div class="btns"><button id="b">رجوع</button></div></div>`);
  $("s").onclick=()=>{names=[""];setup(false)};$("g").onclick=()=>{names=["",""];setup(true)};$("b").onclick=home;
}
function setup(group){
  const out=mode==="out";
  screen(`<div class="card"><h2 style="font-size:36px" class="center">${group?"من يلعب؟":"اسمك"}</h2>
  <p class="rule center">${out?"كل جولة واحد منكم برا السالفة وما يعرف الكلمة. كل واحد يشوف كلمته بسرية، تتناقشون، وتصوّتون على المشتبه به. لازم ٣ لاعبين أو أكثر.":mode==="bomb"?"الجوال يمرّ بين اللاعبين: جاوب بسرعة وامرّر. عندك ٥ ثواني بس تجاوب وتمرّر، وإذا خلص الوقت تنفجر عندك: تخسر ٢ والباقي ياخذون +١.":group?"كل سؤال يجي على لاعب واحد، والأكثر نقاطًا يفوز.":"اكتب اسمك (اختياري)"}</p>
  ${names.map((n,i)=>`<input class="ni" value="${n}" placeholder="${group?"اللاعب "+(i+1):"اسمك"}" aria-label="اسم اللاعب ${i+1}">`).join("")}
  ${group&&names.length<8?'<button id="add" style="width:100%">+ أضف لاعب</button>':""}
  ${out?`<p class="rule center" style="margin:16px 0 8px">التصنيف</p><div class="chips">${["عشوائي",...Object.keys(OUT)].map(c=>`<button data-c="${c}" class="${c===cat?"sel":""}">${c}</button>`).join("")}</div>`
  :`<p class="rule center" style="margin-bottom:6px">${mode==="bomb"?"عدد الانفجارات":"عدد الأسئلة لكل لاعب"}</p><div class="btns">${[3,5,7].map(r=>`<button data-r="${r}" class="${r===R?"sel":""}">${r}</button>`).join("")}</div>`}
  <div class="btns"><button id="back">رجوع</button><button class="main" id="st">ابدأ اللعب</button></div></div>`);
  const read=()=>{names=qa(".ni").map(i=>i.value.trim())};
  if($("add"))$("add").onclick=()=>{read();names.push("");setup(group)};
  qa("[data-c]").forEach(b=>b.onclick=()=>{read();cat=b.dataset.c;setup(group)});
  qa("[data-r]").forEach(b=>b.onclick=()=>{read();R=+b.dataset.r;setup(group)});
  $("back").onclick=home;
  $("st").onclick=()=>{read();out?outStart():mode==="bomb"?bombStart():start(group)};
}
function players(group){return names.map((n,i)=>({n:n||(group?"لاعب "+(i+1):"أنت"),sc:0}))}
function sb(on){return `<div class="score">${G.pl.map((x,i)=>`<span class="chip ${i===on?"on":""}">${x.n}: ${x.sc}</span>`).join("")}</div>`}

/* ---------- فكّ الصورة + ألغاز ---------- */
function start(group){
  const pool=mode==="rid"?RID:Q,pl=players(group),need=pl.length*R;let qs=[];
  while(qs.length<need)qs=qs.concat(shuf(pool));
  G={pl,group,qs:qs.slice(0,need),k:0,all:[...new Set(pool.map(q=>q[2]))],again:()=>start(group)};
  turn();
}
const cur=()=>G.k%G.pl.length;
function turn(){
  if(G.k>=G.qs.length)return end();
  screen(`${sb(cur())}<div class="card center"><p class="rule" style="margin:0">سؤال ${G.k+1} من ${G.qs.length}</p>
  <h2 style="font-size:56px;margin:14px 0">${G.group?"دور "+G.pl[cur()].n:"جاهز؟"}</h2><button class="main" id="rd" style="width:100%">${G.group?"جاهز":"يلا"}</button></div>`);
  $("rd").focus();$("rd").onclick=ask;
}
function ask(){
  const [type,parts,ans]=G.qs[G.k],choice=type==="odd"||Math.random()<.5;let h=0;
  const opts=type==="odd"?shuf(parts.map(x=>x.split(":")[1])):shuf([ans,...shuf(G.all.filter(a=>a!==ans)).slice(0,3)]);
  const pts=choice?6:10;
  const row=type==="rid"?`<div class="riddle">${parts[0]}</div>`:type==="odd"?`<div class="row">${parts.map(x=>`<div class="tile"><span class="em">${x.split(":")[0]}</span></div>`).join("")}</div>`
    :`<div class="row">${parts.map(x=>tile(x,type==="fl")).join("")}<div class="op">=</div><div class="tile q"><span class="ltr">؟</span></div></div>`;
  screen(`${sb(cur())}<div class="card"><p class="rule center" style="margin:0">${TXT[type]}</p>${row}
  ${choice?`<div class="opts">${opts.map(o=>`<button class="o">${o}</button>`).join("")}</div>`
  :`<input id="in" autocomplete="off" enterkeyhint="done" placeholder="اكتب الإجابة" aria-label="الإجابة"><div class="btns"><button class="main" id="ok">تحقق</button><button id="hint">تلميح (−٣)</button><button id="skip">تخطي</button></div>`}
  <div class="msg" id="msg"></div></div>`);
  const msg=$("msg");
  if(choice){qa(".o").forEach(b=>b.onclick=()=>cmp(b.textContent)===cmp(ans)?win(ans,pts):win(ans,0));return}
  const inp=$("in");inp.focus();
  const check=()=>{
    if(!inp.value.trim())return;
    if(cmp(inp.value)===cmp(ans))return win(ans,Math.max(4,pts-3*h));
    const c=document.querySelector(".card");c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");
    msg.textContent="مو هذي، جرّب مرة ثانية";msg.style.color="var(--bad)";
  };
  $("ok").onclick=check;inp.onkeydown=e=>{if(e.key==="Enter")check()};
  $("hint").onclick=()=>{
    h++;
    if(h===1&&type!=="rid"){qa(".nm").forEach(n=>n.classList.add("show"));msg.textContent="ظهرت أسماء الصور"}
    else msg.textContent="الكلمة تبدأ بحرف: "+ans[0]+(ans.startsWith("ال")?ans[1]:"");
    msg.style.color="var(--violet)";
  };
  $("skip").onclick=()=>win(ans,0);
}
function win(ans,g){
  const p=G.pl[cur()];p.sc+=g;
  screen(`${sb(cur())}<div class="card center"><div class="win" style="color:${g?"var(--ok)":"var(--bad)"}">${ans}</div>
  <p class="rule">${g?"صح عليك يا "+p.n+"! +"+g:"الإجابة كانت "+ans+". ما فيه نقاط هالمرة"}</p><button class="main" id="nx" style="width:100%">التالي</button></div>`);
  $("nx").focus();$("nx").onclick=()=>{G.k++;turn()};
}

/* ---------- برا السالفة ---------- */
function outStart(){
  const pl=players(true);
  G={pl,group:true,order:shuf(pl.map((_,i)=>i)),r:0,used:[],again:outStart};
  outRound();
}
function outRound(){
  if(G.r>=G.pl.length)return end();
  const ks=Object.keys(OUT),ck=cat==="عشوائي"?ks[Math.random()*ks.length|0]:cat,list=OUT[ck];
  let w;do{w=list[Math.random()*list.length|0]}while(G.used.includes(w)&&G.used.length<list.length);
  G.used.push(w);Object.assign(G,{ck,w,o:G.order[G.r],i:0,votes:[]});deal();
}
function deal(){
  if(G.i>=G.pl.length)return talk();
  const p=G.pl[G.i];
  screen(`${sb(G.i)}<div class="card center"><p class="rule" style="margin:0">الجولة ${G.r+1} من ${G.pl.length} | التصنيف: ${G.ck}</p>
  <h2 style="font-size:52px;margin:14px 0">${p.n}</h2><p class="rule">خذ الجوال انت بس، واضغط عشان تشوف كلمتك</p><button class="main" id="sh" style="width:100%">اكشف كلمتي</button></div>`);
  $("sh").onclick=()=>{
    const out=G.i===G.o;
    screen(`${sb(G.i)}<div class="card center"><div class="win" style="color:var(--violet)">${out?"أنت برا السالفة 🤫":G.w}</div>
    <p class="rule">${out?"ما تعرف الكلمة، والتصنيف: "+G.ck+". تظاهر إنك تعرفها وحاول تكتشفها من كلامهم.":"لا تقولها صريح! لمّح بس عشان تكشف مين برا السالفة."}</p>
    <button class="main" id="hd" style="width:100%">خبّيها ومرّر الجوال</button></div>`);
    $("hd").onclick=()=>{G.i++;deal()};
  };
}
function talk(){
  let t=180;const first=G.pl[Math.random()*G.pl.length|0].n;
  screen(`${sb(-1)}<div class="card center"><p class="rule" style="margin:0">وقت النقاش</p><div class="tm" id="tm">3:00</div>
  <p class="rule">كل واحد يسأل اللي بعده سؤال عن الكلمة بدون ما يذكرها. يبدأ: ${first}</p><button class="main" id="vt" style="width:100%">ابدأ التصويت</button></div>`);
  T=setInterval(()=>{t--;const e=$("tm");if(e)e.textContent=Math.floor(t/60)+":"+String(t%60).padStart(2,"0");if(t<=0){clearInterval(T);vote(0)}},1000);
  $("vt").onclick=()=>vote(0);
}
function vote(v){
  if(v>=G.pl.length)return result();
  screen(`${sb(v)}<div class="card center"><h2 style="font-size:40px">صوّت يا ${G.pl[v].n}</h2><p class="rule">مين برا السالفة برأيك؟</p>
  <div class="opts">${G.pl.map((p,i)=>i===v?"":`<button data-i="${i}">${p.n}</button>`).join("")}</div></div>`);
  qa("[data-i]").forEach(b=>b.onclick=()=>{G.votes[v]=+b.dataset.i;vote(v+1)});
}
function result(){
  const c=G.pl.map(()=>0);G.votes.forEach(i=>c[i]++);
  const mx=Math.max(...c),caught=c.filter(x=>x===mx).length===1&&c.indexOf(mx)===G.o,o=G.pl[G.o];
  const tally=G.pl.map((p,i)=>`<div class="rk"><span>${p.n}</span><span>${c[i]} أصوات</span></div>`).join("");
  if(!caught){o.sc+=2;return fin(`<h2 style="font-size:40px">${o.n} نجا 😎</h2>${tally}<p class="rule">كان هو برا السالفة وما انكشف! +٢ نقطة له.</p>`)}
  const list=OUT[G.ck],opts=shuf([G.w,...shuf(list.filter(x=>x!==G.w)).slice(0,3)]);
  screen(`${sb(G.o)}<div class="card center"><h2 style="font-size:38px">انكشفت يا ${o.n}!</h2>${tally}
  <p class="rule">عندك فرصة أخيرة: خمّن الكلمة (سلّم الجوال لـ${o.n})</p><div class="opts">${opts.map(x=>`<button class="g">${x}</button>`).join("")}</div></div>`);
  qa(".g").forEach(b=>b.onclick=()=>{
    if(b.textContent===G.w){o.sc+=1;fin(`<h2 style="font-size:38px">خمّن صح 🎯</h2><p class="rule">الكلمة كانت ${G.w}. ${o.n} ياخذ +١ نقطة.</p>`)}
    else{let n=0;G.votes.forEach((x,i)=>{if(x===G.o){G.pl[i].sc+=1;n++}});fin(`<h2 style="font-size:38px">غلط ❌</h2><p class="rule">الكلمة كانت ${G.w}. اللي صوّتوا صح (${n}) ياخذون +١ لكل واحد.</p>`)}
  });
}
function fin(html){
  const last=G.r+1>=G.pl.length;
  screen(`${sb(-1)}<div class="card center">${html}<button class="main" id="nx" style="width:100%">${last?"النتيجة النهائية":"الجولة الجاية"}</button></div>`);
  $("nx").onclick=()=>{G.r++;outRound()};
}

/* ---------- النهاية ---------- */
function end(){
  const r=[...G.pl].sort((a,b)=>b.sc-a.sc),top=r.filter(x=>x.sc===r[0].sc);
  const t=!G.group?"خلصت اللعبة":top.length>1?"تعادل بين "+top.map(x=>x.n).join(" و "):"الفائز: "+top[0].n+" 🏆";
  screen(`<div class="card center"><h2 style="font-size:44px">${t}</h2><div style="margin:16px 0">${r.map((x,i)=>`<div class="rk"><span>${i+1}. ${x.n}</span><span>${x.sc}</span></div>`).join("")}</div>
  <div class="btns"><button class="main" id="again">نفس اللاعبين</button><button id="hm">القائمة</button></div></div>`);
  $("again").onclick=()=>G.again();$("hm").onclick=home;
}
let AC;
function beep(f1,f2,d,v,type){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||"triangle";o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
document.addEventListener("click",e=>{if(e.target.closest("button"))beep(900,450,.06,.1)});
/* ---------- القنبلة ---------- */
const BQ=["سمِّ ٣ أشياء تلقاها في المطبخ", "سمِّ ٣ أنواع سيارات", "سمِّ ٣ لاعبين كورة", "سمِّ ٣ حيوانات تعيش في الصحراء", "سمِّ ٣ دول تبدأ بحرف الميم", "سمِّ ٣ أشياء حمراء", "سمِّ ٣ أكلات شعبية", "سمِّ ٣ أشياء تلقاها في الحقيبة", "سمِّ ٣ أشياء باردة", "سمِّ ٣ مدن عربية", "سمِّ ٣ أشياء تطير", "سمِّ ٣ أشياء تلقاها في غرفة النوم", "سمِّ ٣ مشروبات", "سمِّ ٣ أشياء تشتغل بالبطارية", "سمِّ ٣ أسماء تبدأ بحرف س", "سمِّ ٣ فواكه صيفية", "سمِّ ٣ أشياء تلقاها في السيارة", "سمِّ ٣ ماركات جوالات"];
function bombStart(){const pl=players(true);G={pl,group:true,r:0,again:bombStart};bombRound()}
function bombRound(){
  if(G.r>=R)return end();
  G.fuse=12+(Math.random()*19|0);G.t=0;G.hold=Math.random()*G.pl.length|0;bombTurn();
}
function bombTurn(){
  const q=BQ[Math.random()*BQ.length|0],p=G.pl[G.hold];
  screen(`${sb(G.hold)}<div class="card center"><p class="rule" style="margin:0">انفجار ${G.r+1} من ${R}</p><div class="bomb">💣</div><div class="cd" id="cd">5</div>
  <h2 style="font-size:40px">${p.n}</h2><p class="riddle">${q}</p>
  <button class="main" id="ps" style="width:100%">جاوبت، مرّر القنبلة</button></div>`);
  $("ps").onclick=()=>{let n;do{n=Math.random()*G.pl.length|0}while(n===G.hold);G.hold=n;bombTurn()};
  let sec=5;T=setInterval(()=>{sec--;const c=$("cd");if(c)c.textContent=sec;beep(sec<=2?1500:700,600,.04,.08,"square");if(sec<=0){clearInterval(T);boom()}},1000);
}
function boom(){
  beep(220,40,.7,.3,"sawtooth");
  G.pl.forEach((p,i)=>p.sc+=i===G.hold?-2:1);
  const n=G.pl[G.hold].n;
  screen(`${sb(G.hold)}<div class="card center"><div class="win" style="font-size:90px">💥</div><h2 style="font-size:42px">انفجرت عند ${n}!</h2><p class="rule">${n} −٢ والباقي +١</p><button class="main" id="nx" style="width:100%">${G.r+1>=R?"النتيجة":"قنبلة جديدة"}</button></div>`);
  $("nx").onclick=()=>{G.r++;bombRound()};
}
$("homeBtn").onclick=home;
home();
</script>
</body>
</html>
